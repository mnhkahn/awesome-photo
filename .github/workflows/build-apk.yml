name: Android Release Build

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      version:
        description: Version name, for example 0.1.7
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
      # Accept the copied Homework secret during migration; prefer the app-neutral name.
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.HOMEWORK_RELEASE_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
      PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
      LARK_RELEASE_WEBHOOK: ${{ secrets.LARK_RELEASE_WEBHOOK }}
      PGYER_SHORTCUT: ${{ vars.PGYER_SHORTCUT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release configuration
        run: |
          test -n "$VERSION"
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$PGYER_API_KEY"
          [[ "$VERSION" =~ ^v?[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z.]+)?$ ]]
      - name: Configure signing key
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed APK
        run: |
          VERSION_NAME="${VERSION#v}"
          gradle_args=(--no-daemon :app:assembleRelease \
            -PreleaseVersionName="$VERSION_NAME" \
            -PreleaseVersionCode="$GITHUB_RUN_NUMBER")
          # A short link is optional. Without one, Pgyer still publishes the APK;
          # the App simply does not enable public-page update checks.
          if [ -n "$PGYER_SHORTCUT" ]; then
            gradle_args+=("-PpgyerDownloadPage=https://www.pgyer.com/$PGYER_SHORTCUT")
          fi
          ./gradlew "${gradle_args[@]}"
      - name: Generate release notes with git-chglog
        run: |
          go install github.com/git-chglog/git-chglog/cmd/git-chglog@v0.15.0
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            git-chglog "$VERSION" > RELEASE_NOTES.md
          else
            git-chglog --next-tag "$VERSION" > RELEASE_NOTES.md
          fi
          test -s RELEASE_NOTES.md
      - name: Upload to Pgyer and wait for publication
        id: pgyer
        run: |
          upload_args=(--form "_api_key=$PGYER_API_KEY" --form 'buildType=apk' --form 'buildInstallType=1' \
            --form "buildUpdateDescription=<RELEASE_NOTES.md")
          if [ -n "$PGYER_SHORTCUT" ]; then
            upload_args+=(--form "buildChannelShortcut=$PGYER_SHORTCUT")
          fi
          token=$(curl --fail-with-body --silent --show-error --request POST https://www.pgyer.com/apiv2/app/getCOSToken "${upload_args[@]}")
          echo "$token" | jq -e '.code == 0' >/dev/null
          endpoint=$(echo "$token" | jq -r '.data.endpoint')
          build_key=$(echo "$token" | jq -r '.data.key')
          upload_key=$(echo "$token" | jq -r '.data.params.key')
          signature=$(echo "$token" | jq -r '.data.params.signature')
          security_token=$(echo "$token" | jq -r '.data.params["x-cos-security-token"]')
          if curl --fail-with-body --silent --show-error --connect-timeout 30 --max-time 1800 --request POST "$endpoint" \
            --form-string "key=$upload_key" --form-string "signature=$signature" \
            --form-string "x-cos-security-token=$security_token" --form-string 'x-cos-meta-file-name=app-release.apk' \
            --form "file=@app/build/outputs/apk/release/app-release.apk"; then
            : # Fast upload started Pgyer's publication queue.
          else
            # Pgyer's legacy endpoint is slower but avoids a transient COS
            # signed-URL expiry, so retain it as a reliable CI fallback.
            legacy=$(curl --fail-with-body --silent --show-error --connect-timeout 20 --max-time 600 --request POST https://upload.pgyer.com/apiv2/app/upload \
              --form "_api_key=$PGYER_API_KEY" --form 'buildInstallType=1' \
              --form "buildUpdateDescription=<RELEASE_NOTES.md" \
              --form "file=@app/build/outputs/apk/release/app-release.apk")
            echo "$legacy" | jq -e '.code == 0' >/dev/null
            build_key=$(echo "$legacy" | jq -r '.data.buildKey')
          fi
          for attempt in {1..60}; do
            status=$(curl --fail-with-body --silent --show-error "https://www.pgyer.com/apiv2/app/buildInfo?_api_key=$PGYER_API_KEY&buildKey=$build_key")
            code=$(echo "$status" | jq -r '.code')
            if [ "$code" = 0 ]; then
              shortcut=$(echo "$status" | jq -r '.data.buildShortcutUrl // empty')
              if [ -n "$shortcut" ]; then
                echo "download_page=https://www.pgyer.com/$shortcut" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            [ "$code" = 1246 ] || [ "$code" = 1247 ] || { echo "$status"; exit 1; }
            sleep 3
          done
          echo 'Timed out waiting for Pgyer publication.' >&2
          exit 1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file RELEASE_NOTES.md
          if [ -n '${{ steps.pgyer.outputs.download_page }}' ]; then
            echo "Pgyer download page: ${{ steps.pgyer.outputs.download_page }}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Notify Lark about the published release
        env:
          PGYER_DOWNLOAD_PAGE: ${{ steps.pgyer.outputs.download_page }}
        run: |
          test -n "$LARK_RELEASE_WEBHOOK"
          release_links="GitHub Release：https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          [ -z "$PGYER_DOWNLOAD_PAGE" ] || release_links="蒲公英：$PGYER_DOWNLOAD_PAGE\\n$release_links"
          payload=$(jq -n \
            --arg text "壁纸照片分析器 $VERSION 已发布\\n$release_links" \
            '{msg_type: "text", content: {text: $text}}')
          curl --fail-with-body --silent --show-error --request POST "$LARK_RELEASE_WEBHOOK" \
            --header 'Content-Type: application/json' --data "$payload"
      - name: Notify Lark about a failed release
        if: ${{ failure() && env.LARK_RELEASE_WEBHOOK != '' }}
        continue-on-error: true
        run: |
          payload=$(jq -n \
            --arg text "壁纸照片分析器 $VERSION 发布失败\\n请查看：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{msg_type: "text", content: {text: $text}}')
          curl --fail-with-body --silent --show-error --request POST "$LARK_RELEASE_WEBHOOK" \
            --header 'Content-Type: application/json' --data "$payload"
